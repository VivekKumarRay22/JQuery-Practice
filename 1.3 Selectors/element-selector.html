<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Selector</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $("button").click(function () {
          $("p").hide()
          $("h1").hide()
        })
        l̥
      })
    </script>
  </head>

  <body>
    <h1>This is an H1 element and will be hidden.</h1>

    <p>This is a paragraph and will also be hidden.</p>

    <div>This DIV element will remain visible.</div>

    <button>Hide all H1 and P elements</button>
  </body>
</html>
