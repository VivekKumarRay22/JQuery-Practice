<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>mouseleave()</title>

    <link rel="stylesheet" href="box.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
      $(document).ready(function () {
        $(".box1").mouseleave(function () {
          $(this).css("background-color", "skyblue")
          $(this).find("p").text("You left Box 1!")
        })

        $(".box2").mouseleave(function () {
          $(this).css("background-color", "lightgreen")
          $(this).find("p").text("You left Box 2!")
        })

        $(".box3").mouseleave(function () {
          $(this).css("background-color", "lightcoral")
          $(this).find("p").text("You Left Box 3!")
        })

        $(".box4").mouseleave(function () {
          $(this).css("background-color", "plum")
          $(this).find("p").text("You left Box 4!")
        })
      })
    </script>
  </head>

  <body>
    <div class="container">
      <div class="box box1">
        <h2>Box 1</h2>
        <p>Enter and leave this box.</p>
      </div>

      <div class="box box2">
        <h2>Box 2</h2>
        <p>Enter and leave this box.</p>
      </div>

      <div class="box box3">
        <h2>Box 3</h2>
        <p>Enter and leave this box.</p>
      </div>

      <div class="box box4">
        <h2>Box 4</h2>
        <p>Enter and leave this box.</p>
      </div>
    </div>
  </body>
</html>
