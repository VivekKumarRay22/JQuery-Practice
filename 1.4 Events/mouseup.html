<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mouseup()</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 15px;
      }
      button {
        background-color: rgb(7, 63, 231);
        color: white;
        padding: 10px;
        border: none;
        border-radius: 5px;
        
      }
      button:active {
        transition: scale(0.9);
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $("button").mouseup(function () {
          $(this).text("Mouse button released.")
        })
      })
    </script>
  </head>
  <body>
    <h2>mouseup() event</h2>
    <button>Press and release the button.</button>
  </body>
</html>
